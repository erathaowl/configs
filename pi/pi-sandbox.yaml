image:
  name: pi-sandbox
  distribution: ubuntu
  release: noble
  description: Pi coding agent sandbox
  architecture: aarch64

source:
  downloader: debootstrap
  url: http://ports.ubuntu.com/ubuntu-ports
  components:
    - main
    - universe

packages:
  manager: apt
  update: true
  cleanup: true

  sets:
    - packages:
        - bash
        - ca-certificates
        - git
        - ripgrep
        - curl
        - nano
        - python3
        - python3-pip
        - python3-venv
        - systemd-resolved
      action: install
      flags:
        - --no-install-recommends

files:
  - path: /etc/systemd/network/10-eth0.network
    generator: dump
    content: |-
      [Match]
      Name=eth0

      [Network]
      DHCP=ipv4
      IPv6AcceptRA=no

actions:
  - trigger: post-packages
    action: |-
      #!/bin/bash
      set -euxo pipefail

      # Configure networking
      systemctl enable systemd-networkd
      systemctl enable systemd-resolved

      rm -f /etc/resolv.conf
      ln -sf ../run/systemd/resolve/stub-resolv.conf /etc/resolv.conf

      # Install Node.js 24 and npm
      curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
      apt-get install -y --no-install-recommends nodejs

      # Update npm
      npm install --global npm@latest

      # Install Astral uv
      curl -LsSf https://astral.sh/uv/install.sh \
        | env UV_INSTALL_DIR="/usr/local/bin" UV_NO_MODIFY_PATH=1 sh

      # Install Ruff globally through uv
      UV_TOOL_DIR=/opt/uv-tools \
      UV_TOOL_BIN_DIR=/usr/local/bin \
        uv tool install ruff@latest

      # Install Pi coding agent
      npm install \
        --global \
        --ignore-scripts \
        @earendil-works/pi-coding-agent

      # Preserve the real Git binary and install the remote-write guard
      dpkg-divert \
        --local \
        --rename \
        --add \
        --divert /usr/bin/git-real \
        /usr/bin/git

      cat > /usr/bin/git <<'WRAPPER'
      #!/usr/bin/env bash
      set -euo pipefail

      args=("$@")
      command=""
      command_index=-1
      i=0

      while (( i < ${#args[@]} )); do
          arg="${args[$i]}"

          case "$arg" in
              -C|-c|--git-dir|--work-tree|--namespace|--super-prefix|--config-env)
                  ((i += 2))
                  ;;
              -*)
                  ((i += 1))
                  ;;
              *)
                  command="$arg"
                  command_index="$i"
                  break
                  ;;
          esac
      done

      if [[ "$command" == "push" || "$command" == "send-pack" ]]; then
          echo "ERROR: Remote Git writes are disabled in this sandbox." >&2
          exit 1
      fi

      if [[ "$command" == "lfs" && "${args[$((command_index + 1))]:-}" == "push" ]]; then
          echo "ERROR: Remote Git writes are disabled in this sandbox." >&2
          exit 1
      fi

      exec /usr/bin/git-real "$@"
      WRAPPER
      chmod 755 /usr/bin/git

      mkdir -p /workspace

      apt-get clean
      rm -rf /var/lib/apt/lists/*

mappings:
  architecture_map: debian
